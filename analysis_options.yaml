# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Fail on implicit downcasts and raw generic types instead of silently
    # accepting dynamic.
    #
    # strict-inference is deliberately left off: it flags idiomatic Flutter
    # constructor calls such as Future.delayed(Duration(...)) and
    # MaterialPageRoute(builder: ...), which is a lot of noise for very little
    # safety on top of the two above.
    strict-casts: true
    strict-raw-types: true

  errors:
    # Dead code and unused declarations should not be able to accumulate the
    # way they did before; treat them as build failures rather than notes.
    unused_import: error
    unused_local_variable: error
    unused_field: error
    dead_code: error

linter:
  rules:
    - avoid_empty_else
    - avoid_returning_null_for_void
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - depend_on_referenced_packages
    - only_throw_errors
    - prefer_final_locals
    - prefer_single_quotes
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_parenthesis
    - use_super_parameters

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
